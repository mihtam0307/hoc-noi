name: Build & Release APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Giải mã khóa ký (nếu có)
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Chưa có KEYSTORE_BASE64, APK sẽ ký bằng khóa debug và KHÔNG cập nhật đè được bản cũ."
          fi

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon -PverCode=${{ github.run_number }}

      - name: Đổi tên APK
        run: cp app/build/outputs/apk/release/app-release.apk hoc-noi.apk

      - uses: actions/upload-artifact@v4
        with:
          name: hoc-noi-apk
          path: hoc-noi.apk

      - name: Phát hành bản mới
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN || github.token }}
          NOTES: ${{ github.event.head_commit.message || 'Bản cập nhật mới' }}
        run: |
          gh release create "v${{ github.run_number }}" hoc-noi.apk \
            --repo "${{ vars.RELEASE_REPO || github.repository }}" \
            --title "Học Nổi v${{ github.run_number }}" \
            --notes "$NOTES"
